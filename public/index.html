<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2c7a3d" />
  <title>箕面ハイキング</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
  <link rel="stylesheet" href="style.css" />

  <script type="importmap">
    {
      "imports": {
        "leaflet": "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js"
      }
    }
  </script>
</head>
<body>
  <!-- 全画面の地理院地図(ホーム/マップビューで共有、常時表示) -->
  <div id="map" role="application" aria-label="箕面エリア地理院地図"></div>

  <!-- 一時メッセージ(トースト): 移動記録の開始・終了時などに表示し自動で閉じる -->
  <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

  <!-- 全ビュー共通の固定トップエリア(オンライン状態 + マニフェスト更新バナー) -->
  <div id="updateBanner" class="update-banner" hidden role="status" aria-live="polite">
    <div class="update-banner-message" id="updateBannerMessage"></div>
    <div class="update-banner-actions">
      <button type="button" id="btnUpdateDiff" class="btn btn-banner">差分のみ更新</button>
      <button type="button" id="btnUpdateAll" class="btn btn-banner">すべて更新</button>
      <button type="button" id="btnUpdateLater" class="btn btn-banner btn-banner-secondary">後で</button>
      <button type="button" id="btnUpdateClose" class="update-banner-close" aria-label="バナーを閉じる">×</button>
    </div>
  </div>

  <!-- 初期画面(ホーム) -->
  <section class="view view-home" id="viewHome">
    <img class="home-image" src="icons/Startup-512x918.png" alt="" aria-hidden="true" />
    <nav class="home-menu" aria-label="メインメニュー">
      <button type="button" class="home-btn" data-view="map">ハイキングマップ表示</button>
      <button type="button" class="home-btn" data-view="nav">ハイキングコースの案内・ナビ</button>
      <button type="button" class="home-btn" id="btnOpenDownload">地図のダウンロード（オフライン用）</button>
      <button type="button" class="home-btn" id="btnOpenSettings">設定と情報</button>
    </nav>
  </section>

  <!-- ハイキングマップ表示(地図そのものは body 直下の #map を共有) -->
  <section class="view view-map" id="viewMap" hidden>
    <button type="button" class="btn-float btn-menu-float" id="btnMapLayers" aria-label="表示設定">≡</button>
    <!-- 時刻表示(メニューボタンの左): 「時刻を表示」トグル ON のときのみ表示 -->
    <div class="map-clock" id="mapClock" hidden role="status" aria-live="off"></div>
    <!-- 移動経路を記録 ON のとき、メニューボタンの下に表示する操作ボタン群 -->
    <div class="map-track-actions" id="mapTrackActions" hidden>
      <!-- 記録開始/停止を兼ねるトグルボタン。記録中は is-recording クラスで停止アイコンに切替 -->
      <button type="button" class="btn-float btn-track-action" id="btnTrackToggle" aria-label="記録開始" title="記録開始">
        <svg class="icon-track-start" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
          <path d="M8 5v14l11-7z" fill="currentColor"/>
        </svg>
        <svg class="icon-track-stop" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
          <rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/>
        </svg>
      </button>
      <button type="button" class="btn-float btn-track-action" id="btnTrackPhoto" aria-label="写真撮影" title="写真撮影">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
          <path d="M9 3l-1.8 2H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9zm3 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z" fill="currentColor"/>
        </svg>
      </button>
    </div>
    <div class="map-layer-panel" id="mapLayerPanel" hidden>
      <label class="toggle toggle-switch">
        <input type="checkbox" id="toggleClock" />
        <span class="toggle-slider" aria-hidden="true"></span>
        <span class="toggle-text">時刻を表示</span>
      </label>
      <label class="toggle toggle-switch">
        <input type="checkbox" id="toggleEmergencyPoints" checked />
        <span class="toggle-slider" aria-hidden="true"></span>
        <span class="toggle-text">緊急ポイントを表示</span>
      </label>
      <label class="toggle toggle-switch">
        <input type="checkbox" id="toggleHikingRoutes" checked />
        <span class="toggle-slider" aria-hidden="true"></span>
        <span class="toggle-text">ハイキングルートを表示</span>
      </label>
      <label class="toggle toggle-switch">
        <input type="checkbox" id="toggleTrackRecording" />
        <span class="toggle-slider" aria-hidden="true"></span>
        <span class="toggle-text">移動経路を記録</span>
      </label>
      <!-- 移動経路: 統計表示(サイズ)とクリア -->
      <div class="track-inline-actions">
        <button type="button" class="btn-track-mini" id="btnTrackStats">サイズ</button>
        <button type="button" class="btn-track-mini" id="btnTrackClear">クリア</button>
      </div>
      <hr class="panel-divider" />
      <button type="button" class="panel-btn" id="btnMapOpenMarkerSettings">マーカーの設定</button>
      <button type="button" class="panel-btn" id="btnMapOpenImageSettings">撮影画像の解像度の設定</button>
      <hr class="panel-divider" />
      <button type="button" class="panel-btn panel-btn-back" data-view="home">起動時の画面に戻る</button>
    </div>
  </section>

  <!-- ハイキングコースの案内・ナビ(地図そのものは body 直下の #map を共有) -->
  <section class="view view-nav" id="viewNav" hidden>
    <button type="button" class="btn-float btn-back-float" data-view="home" aria-label="ホームに戻る">
      <svg class="icon-back" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
        <path d="M15.5 4.5L8 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button type="button" class="btn-float btn-menu-float" id="btnNavMenu" aria-label="ナビメニュー">≡</button>
    <div class="nav-pending">
      <p class="placeholder-message">この機能は準備中です。</p>
    </div>
  </section>

  <!-- オフライン地図ダウンロードモーダル -->
  <div class="modal" id="downloadModal" hidden role="dialog" aria-modal="true" aria-labelledby="downloadTitle">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-panel" role="document">
      <header class="modal-header">
        <h2 id="downloadTitle">地図のダウンロード（オフライン用）</h2>
        <button type="button" class="btn-icon" data-close-modal aria-label="閉じる">×</button>
      </header>
      <div class="modal-body">
        <div class="storage-info">
          <div class="info-row">
            <span class="info-label">ダウンロード済み地図バージョン:</span>
            <span class="info-value" id="downloadedVersion">-</span>
          </div>
          <div class="info-row">
            <span class="info-label">ファイルサイズ(MB):</span>
            <span class="info-value" id="downloadedSizeMB">-</span>
          </div>
        </div>

        <label class="toggle toggle-row">
          <input type="checkbox" id="toggleDetail" checked />
          <span class="toggle-label">
            <span class="toggle-title">詳細地図(z=18)を含む</span>
          </span>
        </label>

        <div class="button-group button-group-row">
          <button type="button" id="btnDownloadMap" class="btn btn-primary">ダウンロード</button>
          <button type="button" id="btnClearCache" class="btn btn-danger">クリア</button>
        </div>

        <div class="status-message" id="statusMessage" role="status" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <!-- 設定と情報モーダル(起動画面の「設定と情報」から表示) -->
  <div class="modal" id="infoSettingsModal" hidden role="dialog" aria-modal="true" aria-labelledby="infoSettingsTitle">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-panel" role="document">
      <header class="modal-header">
        <h2 id="infoSettingsTitle">設定と情報</h2>
        <button type="button" class="btn-icon" data-close-modal aria-label="閉じる">×</button>
      </header>
      <div class="modal-body">
        <!-- ===== 設定 ===== -->
        <section class="info-section">
          <h3 class="info-section-title">設定</h3>
          <div class="info-section-actions">
            <button type="button" class="btn btn-secondary" id="btnInfoOpenMarkerSettings">マーカーの設定</button>
            <button type="button" class="btn btn-secondary" id="btnInfoOpenImageSettings">撮影画像の解像度の設定</button>
          </div>
        </section>

        <!-- ===== 情報 ===== -->
        <section class="info-section">
          <h3 class="info-section-title">情報</h3>

          <!-- 起動時にアプリの更新版を確認(設定から移動) -->
          <label class="toggle toggle-switch">
            <input type="checkbox" id="toggleStartupUpdateCheck" />
            <span class="toggle-slider" aria-hidden="true"></span>
            <span class="toggle-text">起動時にアプリの更新版を確認</span>
          </label>

          <!-- バージョン情報(既定オン) -->
          <label class="toggle toggle-switch">
            <input type="checkbox" id="toggleInfoVersion" checked />
            <span class="toggle-slider" aria-hidden="true"></span>
            <span class="toggle-text">バージョン情報</span>
          </label>
          <div class="info-collapse" id="infoVersionBody">
            <div class="info-row">
              <span class="info-label">アプリ名:</span>
              <span class="info-value">箕面ハイキングマップ</span>
            </div>
            <div class="info-row">
              <span class="info-label">
                地図バージョン:
                <span class="info-sublabel">（地図タイルマニフェスト）</span>
              </span>
              <span class="info-value" id="versionManifest">-</span>
            </div>
            <div class="info-row">
              <span class="info-label">
                アプリバージョン:
                <span class="info-sublabel">（アプリシェル）</span>
              </span>
              <span class="info-value" id="versionAppShell">-</span>
            </div>
          </div>

          <!-- メッセージ履歴の表示(既定オフ) -->
          <label class="toggle toggle-switch">
            <input type="checkbox" id="toggleInfoMessages" />
            <span class="toggle-slider" aria-hidden="true"></span>
            <span class="toggle-text">メッセージ履歴の表示</span>
          </label>
          <div class="info-collapse" id="infoMessagesBody" hidden>
            <div class="info-messages-actions">
              <button type="button" class="btn-icon" id="btnClearMessages" aria-label="履歴を消去">🗑</button>
            </div>
            <ul class="message-list" id="messageList"></ul>
            <p class="message-empty" id="messageEmpty" hidden>履歴はありません。</p>
          </div>

          <!-- このアプリについて(既定オフ) -->
          <label class="toggle toggle-switch">
            <input type="checkbox" id="toggleInfoAbout" />
            <span class="toggle-slider" aria-hidden="true"></span>
            <span class="toggle-text">このアプリについて</span>
          </label>
          <div class="info-collapse" id="infoAboutBody" hidden>
            <div class="info-row">
              <span class="info-label">アプリ名:</span>
              <span class="info-value">箕面ハイキングマップ</span>
            </div>
            <div class="info-row">
              <span class="info-label">参照先URL:</span>
              <span class="info-value info-value-url" id="currentUrl">-</span>
            </div>
            <div class="info-row">
              <span class="info-label">開発者等:</span>
              <span class="info-value">仕様検討中</span>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <!-- 設定モーダル(マーカー / 画像解像度) -->
  <div class="modal" id="settingsModal" hidden role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-panel" role="document">
      <header class="modal-header">
        <h2 id="settingsTitle">設定</h2>
        <button type="button" class="btn-icon" data-close-modal aria-label="閉じる">×</button>
      </header>
      <div class="modal-body">
        <section class="settings-section" data-section="marker">
          <h3 class="settings-section-title">マーカーの設定</h3>
          <div class="marker-settings-list" id="markerSettingsList"></div>
          <div class="marker-settings-actions">
            <button type="button" class="btn btn-secondary" id="btnResetMarkerSettings">規定値に戻す</button>
          </div>
        </section>

        <section class="settings-section" data-section="image">
          <h3 class="settings-section-title">撮影画像の解像度の設定</h3>
          <p class="placeholder-message">この機能は準備中です。</p>
        </section>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
