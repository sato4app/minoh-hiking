<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2c7a3d" />
  <title>箕面ハイキング</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
  <link rel="stylesheet" href="style.css" />

  <script type="importmap">
    {
      "imports": {
        "leaflet": "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js"
      }
    }
  </script>
</head>
<body>
  <!-- 全ビュー共通の固定トップエリア(オンライン状態 + マニフェスト更新バナー) -->
  <div id="updateBanner" class="update-banner" hidden role="status" aria-live="polite">
    <div class="update-banner-message" id="updateBannerMessage"></div>
    <div class="update-banner-actions">
      <button type="button" id="btnUpdateDiff" class="btn btn-banner">差分のみ更新</button>
      <button type="button" id="btnUpdateAll" class="btn btn-banner">すべて更新</button>
      <button type="button" id="btnUpdateLater" class="btn btn-banner btn-banner-secondary">後で</button>
      <button type="button" id="btnUpdateClose" class="update-banner-close" aria-label="バナーを閉じる">×</button>
    </div>
  </div>

  <!-- 初期画面(ホーム) -->
  <section class="view view-home" id="viewHome">
    <div class="home-bg" id="homeMap" role="application" aria-label="箕面エリア地理院地図"></div>
    <header class="home-header">
      <h1>箕面ハイキング</h1>
      <span class="online-indicator" id="onlineIndicator" aria-live="polite" title="オンライン">●</span>
    </header>
    <nav class="home-menu" aria-label="メインメニュー">
      <button type="button" class="home-btn" data-view="map">ハイキングマップ表示</button>
      <button type="button" class="home-btn" data-view="nav">ハイキングコース案内・ナビ</button>
      <button type="button" class="home-btn" data-view="collect">コース分岐路等のデータ収集</button>
      <button type="button" class="home-btn" id="btnOpenSettings">設定</button>
    </nav>
  </section>

  <!-- ハイキングマップ表示 -->
  <section class="view view-map" id="viewMap" hidden>
    <header class="view-header">
      <button type="button" class="btn-back" data-view="home" aria-label="ホームに戻る">←</button>
      <h2>ハイキングマップ</h2>
      <button type="button" class="btn-icon" id="btnMapLayers" aria-label="表示設定">≡</button>
    </header>
    <div id="map" role="application" aria-label="地理院地図"></div>
    <div class="map-layer-panel" id="mapLayerPanel" hidden>
      <label class="toggle">
        <input type="checkbox" id="toggleBuffers" />
        <span>バッファ範囲を表示</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="toggleEmergencyPoints" checked />
        <span>緊急ポイントを表示</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="toggleHikingRoutes" checked />
        <span>ハイキングコースを表示</span>
      </label>
    </div>
  </section>

  <!-- ハイキングコース案内・ナビ(プレースホルダ) -->
  <section class="view view-placeholder" id="viewNav" hidden>
    <header class="view-header">
      <button type="button" class="btn-back" data-view="home" aria-label="ホームに戻る">←</button>
      <h2>ハイキングコース案内・ナビ</h2>
    </header>
    <div class="placeholder-body">
      <p class="placeholder-message">この機能は準備中です。</p>
    </div>
  </section>

  <!-- コース分岐路等のデータ収集(プレースホルダ) -->
  <section class="view view-placeholder" id="viewCollect" hidden>
    <header class="view-header">
      <button type="button" class="btn-back" data-view="home" aria-label="ホームに戻る">←</button>
      <h2>コース分岐路等のデータ収集</h2>
    </header>
    <div class="placeholder-body">
      <p class="placeholder-message">この機能は準備中です。</p>
    </div>
  </section>

  <!-- メッセージ履歴 -->
  <section class="view view-messages" id="viewMessages" hidden>
    <header class="view-header">
      <button type="button" class="btn-back" data-view="home" aria-label="ホームに戻る">←</button>
      <h2>メッセージ履歴</h2>
      <button type="button" class="btn-icon" id="btnClearMessages" aria-label="履歴を消去">🗑</button>
    </header>
    <ul class="message-list" id="messageList"></ul>
    <p class="message-empty" id="messageEmpty" hidden>履歴はありません。</p>
  </section>

  <!-- 設定モーダル -->
  <div class="modal" id="settingsModal" hidden role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-panel" role="document">
      <header class="modal-header">
        <h2 id="settingsTitle">設定</h2>
        <button type="button" class="btn-icon" data-close-modal aria-label="閉じる">×</button>
      </header>
      <div class="modal-body">
        <label class="toggle toggle-row">
          <input type="checkbox" id="toggleDetail" />
          <span class="toggle-label">
            <span class="toggle-title">詳細データをダウンロード</span>
            <span class="toggle-detail" id="toggleDetailHint">Off:z=10〜17、On:z=10〜18</span>
          </span>
        </label>

        <div class="storage-info">
          <div class="info-row">
            <span class="info-label">キャッシュ済タイル:</span>
            <span class="info-value" id="cachedTileCount">-</span>
          </div>
          <div class="info-row">
            <span class="info-label">推定使用容量:</span>
            <span class="info-value" id="estimatedSize">-</span>
          </div>
          <div class="info-row">
            <span class="info-label">実測使用容量:</span>
            <span class="info-value" id="measuredSize">-</span>
          </div>
        </div>

        <div class="button-group">
          <button type="button" id="btnDownloadMap" class="btn btn-primary">オフライン用地図データをダウンロード</button>
          <button type="button" id="btnPause" class="btn btn-warning" hidden>一時停止</button>
          <button type="button" id="btnResume" class="btn btn-warning" hidden>再開</button>
          <button type="button" id="btnAbort" class="btn btn-warning" hidden>中断</button>
          <button type="button" id="btnClearCache" class="btn btn-danger">ダウンロードした地図データをクリア</button>
          <button type="button" class="btn btn-secondary" data-view="messages" data-close-modal>メッセージ履歴を表示</button>
        </div>

        <div class="progress-area" id="progressArea" hidden>
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="progress-text" id="progressText">準備中...</div>
        </div>

        <div class="status-message" id="statusMessage" role="status" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
